<title>Mapa emocional AndyGram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: arriba la búsqueda y las emociones; abajo el grafo; a la derecha el panel de lectura
   (en el celular se apila abajo); la línea de tiempo corre bajo el grafo.
   Dos modos: claro y noche. Cada emoción tiene su color de Intensamente (o la mezcla de dos). */
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --raised: #eef1f5;
  --hair: rgba(22, 26, 34, 0.12);
  --hair-strong: rgba(22, 26, 34, 0.3);
  --ink: #161a22;
  --ink-2: #4a5160;
  --ink-3: #6a7180;
  --accent: #c2410c;
  --shadow: rgba(22, 26, 34, 0.16);
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1218; --panel: #151920; --raised: #1c212b;
    --hair: rgba(236, 238, 243, 0.10); --hair-strong: rgba(236, 238, 243, 0.3);
    --ink: #eceef3; --ink-2: #a9afbd; --ink-3: #7c8394;
    --accent: #d95926; --shadow: rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1218; --panel: #151920; --raised: #1c212b;
  --hair: rgba(236, 238, 243, 0.10); --hair-strong: rgba(236, 238, 243, 0.3);
  --ink: #eceef3; --ink-2: #a9afbd; --ink-3: #7c8394;
  --accent: #d95926; --shadow: rgba(0, 0, 0, 0.45);
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(320px, 400px);
  grid-template-rows: minmax(0, 1fr) auto;
}

/* Escenario del grafo */
.stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  overflow: hidden;
}
#graph { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.top { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 14px 16px 8px; }
.brand { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.brand h1 {
  margin: 0;
  font: 800 28px/1 var(--display);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.brand p { margin: 0; color: var(--ink-3); font-size: 12px; }
.theme-btn {
  margin-left: auto;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  align-self: center;
  border-radius: 50%;
  border: 1px solid var(--hair);
  background: var(--panel);
  color: var(--ink-2);
}
.theme-btn:hover { color: var(--ink); border-color: var(--hair-strong); }
.search { position: relative; width: min(100%, 420px); }
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; color: var(--ink-3); }
.search input {
  width: 100%;
  padding: 9px 12px 9px 34px;
  border-radius: 8px;
  border: 1px solid var(--hair);
  background: color-mix(in srgb, var(--panel) 90%, transparent);
  outline: none;
}
.search input::placeholder { color: var(--ink-3); }
.search input:focus-visible { border-color: var(--ink-2); }
.chips { display: grid; gap: 6px; min-width: 0; }
.chip-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chip-label { margin-right: 2px; font: 500 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.chip {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid var(--hair);
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  color: var(--ink-2);
  font-size: 12.5px;
  white-space: nowrap;
}
.chip .n { color: var(--ink-3); font: 500 11px var(--mono); font-variant-numeric: tabular-nums; }
.chip:hover { color: var(--ink); border-color: var(--hair-strong); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--c, var(--accent)); box-shadow: inset 0 0 0 1px var(--c, var(--accent)); }
.chip .key { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; }

.legend {
  position: absolute;
  left: 16px;
  bottom: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  align-items: center;
  max-width: calc(100% - 140px);
  font-size: 11.5px;
  color: var(--ink-3);
  pointer-events: none;
}
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.ramp { display: inline-flex; gap: 3px; }
.view-btns { position: absolute; right: 16px; bottom: 12px; display: flex; gap: 6px; }
.icon-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 11px;
  border-radius: 8px;
  border: 1px solid var(--hair);
  background: color-mix(in srgb, var(--panel) 90%, transparent);
  color: var(--ink-2);
  font-size: 12.5px;
}
.icon-btn:hover { color: var(--ink); }
.notice {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  color: var(--ink-2);
  text-align: center;
}

/* Tooltip */
.tip {
  position: fixed;
  z-index: 20;
  max-width: 300px;
  padding: 9px 11px;
  border-radius: 8px;
  background: var(--raised);
  border: 1px solid var(--hair);
  box-shadow: 0 10px 28px var(--shadow);
  pointer-events: none;
  font-size: 12.5px;
  line-height: 1.4;
  display: grid;
  gap: 3px;
}
.tip .t-meta { font: 500 11px var(--mono); color: var(--ink-3); }
.tip .t-title { font-weight: 600; color: var(--ink); }
.tip .t-text { color: var(--ink-2); }

/* Línea de tiempo */
.timeline {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-top: 1px solid var(--hair);
  background: var(--panel);
}
.round-btn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--hair);
  background: var(--raised);
  color: var(--ink);
}
.round-btn:hover { border-color: var(--hair-strong); }
.tl-date { font: 500 13px var(--mono); color: var(--ink); min-width: 8ch; font-variant-numeric: tabular-nums; }
.tl-track { position: relative; height: 42px; min-width: 0; }
.tl-track canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.tl-track input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  background: transparent;
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
}
.tl-track input:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
.tl-track input::-webkit-slider-runnable-track { height: 42px; background: transparent; }
.tl-track input::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 42px; background: transparent; border: 0; }
.tl-track input::-moz-range-track { height: 42px; background: transparent; }
.tl-track input::-moz-range-thumb { width: 12px; height: 42px; background: transparent; border: 0; }
.speed { font: 500 12px var(--mono); min-width: 44px; }

/* Panel */
.panel {
  grid-column: 2;
  grid-row: 1 / span 2;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-left: 1px solid var(--hair);
}
.panel-head { display: none; }
.panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 20px 32px; }
.eyebrow {
  margin: 0 0 6px;
  font: 500 11px var(--mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.panel h2 {
  margin: 0 0 8px;
  font: 800 32px/1 var(--display);
  letter-spacing: 0.01em;
  text-transform: uppercase;
  text-wrap: balance;
}
.panel h3 { margin: 26px 0 8px; font: 600 13px var(--ui); color: var(--ink-2); }
.lead { margin: 0 0 16px; color: var(--ink-2); }
.small { font-size: 12px; color: var(--ink-3); }
.back {
  margin: -4px 0 14px -8px;
  padding: 4px 8px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink-2);
  font-size: 13px;
}
.back:hover { color: var(--ink); background: var(--raised); }
.emo-list, .post-list { list-style: none; margin: 0; padding: 0; display: grid; }
.emo-list { gap: 2px; }
.emo-item {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 12px;
  padding: 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  text-align: left;
}
.emo-item:hover { background: var(--raised); }
.emo-item .name { font-weight: 600; color: var(--ink); }
.emo-item .count { font: 500 12px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.emo-item .bar { grid-column: 1 / -1; height: 4px; border-radius: 0 2px 2px 0; background: var(--c, var(--ink-3)); }
.emo-item .name { display: inline-flex; align-items: center; gap: 8px; }
.emo-item .key, .io-line .key { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.io-line { display: flex; align-items: center; gap: 8px; margin: -6px 0 14px; font-size: 12px; color: var(--ink-3); }
.emo-item .subs { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); }
.post-item {
  width: 100%;
  display: grid;
  gap: 3px;
  padding: 12px 8px;
  border: 0;
  border-bottom: 1px solid var(--hair);
  background: transparent;
  text-align: left;
}
.post-item:hover { background: var(--raised); }
.post-item .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font: 500 11px var(--mono); color: var(--ink-3); }
.post-item .title { font-weight: 600; color: var(--ink); }
.post-item .consejo { font-size: 13px; color: var(--ink-2); }
.central { display: inline-flex; align-items: center; gap: 5px; }
.central::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--emo, var(--accent)); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.more {
  margin-top: 14px;
  width: 100%;
  padding: 9px;
  border-radius: 8px;
  border: 1px solid var(--hair);
  background: transparent;
  color: var(--ink-2);
}
.more:hover { color: var(--ink); background: var(--raised); }
.consejo-block { margin: 14px 0 16px; padding: 12px 14px; border-radius: 10px; background: var(--raised); }
.consejo-block p:last-child { margin: 0; font-size: 15px; color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.body { font: 400 17px/1.62 var(--read); color: var(--ink); }
.body p { margin: 0 0 0.7em; max-width: 62ch; overflow-wrap: anywhere; }
.link {
  color: var(--ink);
  text-decoration: underline;
  text-decoration-color: var(--ink-3);
  text-underline-offset: 3px;
}
.link:hover { text-decoration-color: var(--ink); }
.read-btn {
  display: inline-flex;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--hair);
  background: var(--raised);
  color: var(--ink);
  font-weight: 500;
  text-decoration: none;
}
.read-btn:hover { border-color: var(--hair-strong); }
.group-title { margin: 18px 0 6px; font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.crisis { display: grid; gap: 8px; margin: 2px 0 18px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--hair-strong); background: var(--raised); }
.crisis .c-title { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
.crisis p { margin: 0; color: var(--ink-2); }
.crisis ul { display: grid; gap: 6px; margin: 2px 0; padding: 0; list-style: none; }
.crisis li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; color: var(--ink); }
.crisis a { font: 500 15px var(--mono); color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink-3); }
.foot { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--ink-3); display: grid; gap: 8px; }
.foot p { margin: 0; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; }
  .brand h1 { font-size: 24px; }
  .brand p { display: none; }
  .chips { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; }
  .chip-group { flex-wrap: nowrap; }
  .chips::-webkit-scrollbar { display: none; }
  .legend { display: none; }
  .timeline { grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 10px; padding: 8px 16px; }
  .timeline .today { display: none; }
  .panel { grid-column: 1; grid-row: 3; border-left: 0; border-top: 1px solid var(--hair); max-height: min(50dvh, 460px); }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    border: 0;
    background: transparent;
    text-align: left;
  }
  .panel-head .ph-title { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel-head .ph-toggle { color: var(--ink-3); font-size: 12px; flex: none; }
  .panel.collapsed .panel-body { display: none; }
  .panel.reading:not(.collapsed) {
    position: fixed;
    inset: 0;
    z-index: 15;
    max-height: none;
    border-top: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .panel.reading:not(.collapsed) .panel-head { border-bottom: 1px solid var(--hair); }
  .panel-body { padding: 4px 16px 24px; }
  .panel h2 { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; }
}
</style>

<div class="app">
  <section class="stage" id="stage" aria-label="Mapa de emociones">
    <div class="top">
      <div class="brand">
        <h1>AndyGram</h1>
        <p id="brand-sub">Mapa emocional</p>
        <button class="theme-btn" id="theme-btn" type="button" aria-label="Cambiar de modo"></button>
      </div>
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="Busca un sentimiento, tema o frase" autocomplete="off" aria-label="Buscar en las notas">
      </label>
      <div class="chips" id="chips" role="toolbar" aria-label="Emociones"></div>
    </div>
    <div id="graph"></div>
    <div class="legend" id="legend" aria-hidden="true"></div>
    <div class="view-btns">
      <button class="icon-btn" id="fit" type="button" title="Ver todo el mapa">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
        Ver todo
      </button>
    </div>
  </section>

  <div class="timeline" id="timeline">
    <button class="round-btn" id="play" type="button" aria-label="Reproducir la historia"></button>
    <span class="tl-date" id="tl-date" aria-live="off"></span>
    <div class="tl-track" id="tl-track">
      <canvas id="tl-canvas" aria-hidden="true"></canvas>
      <input id="tl-range" type="range" min="0" step="1" aria-label="Fecha: muestra las notas publicadas hasta este día">
    </div>
    <button class="icon-btn speed" id="speed" type="button" title="Velocidad de la animación"></button>
    <button class="icon-btn today" id="today" type="button" title="Ir a la nota más reciente">Hoy</button>
  </div>

  <aside class="panel collapsed" id="panel" aria-label="Notas">
    <button class="panel-head" id="panel-head" type="button" aria-expanded="false">
      <span class="ph-title" id="ph-title">¿Cómo te sientes hoy?</span>
      <span class="ph-toggle" id="ph-toggle">Ver notas</span>
    </button>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>
<div class="tip" id="tip" hidden></div>

<script type="application/json" id="andygram-data">__DATA__</script>
<script src="https://cdn.jsdelivr.net/npm/force-graph@1.52.0/dist/force-graph.min.js"></script>
<script>
(() => {
  'use strict';

  // ---------- Datos ----------
  const RAW = JSON.parse(document.getElementById('andygram-data').textContent);
  const DAY0 = Date.UTC(2020, 0, 1);
  const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const dayOf = (s) => Math.round((Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) - DAY0) / 864e5);
  const dateOfDay = (d) => new Date(DAY0 + d * 864e5);
  const fmtDate = (s) => `${+s.slice(8, 10)} ${MESES[+s.slice(5, 7) - 1]} ${s.slice(0, 4)}`;
  const fmtDay = (d) => { const t = dateOfDay(d); return `${t.getUTCDate()} ${MESES[t.getUTCMonth()]} ${t.getUTCFullYear()}`; };
  const fmtMonth = (d) => { const t = dateOfDay(d); return `${MESES[t.getUTCMonth()]} ${t.getUTCFullYear()}`; };
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const nf = new Intl.NumberFormat('es-MX');
  const plural = (n, one, many) => `${nf.format(n)} ${n === 1 ? one : many}`;

  const emotions = RAW.emotions.map((e, i) => ({ i, id: e.id, name: e.name, desc: e.desc, good: e.valence === 'agradable', crisis: !!e.crisis, colors: e.color, io: e.io, subs: [] }));
  const subs = [];
  RAW.emotions.forEach((e, ei) => e.subs.forEach((s) => {
    const sub = { i: subs.length, id: s.id, name: s.name, desc: s.desc, emo: ei, crisis: !!s.crisis || !!e.crisis };
    subs.push(sub);
    emotions[ei].subs.push(sub.i);
  }));
  const posts = RAW.posts.map(([slug, title, date, consejo, tags, sims, body], i) => ({
    i, slug, title, date, consejo, tags, sims, body,
    day: dayOf(date),
    url: RAW.baseUrl + slug,
    emos: [...new Set(tags.map(([s]) => subs[s].emo))],
  }));
  const LAST_DAY = posts.reduce((m, p) => Math.max(m, p.day), 0);
  const monthIndex = (day) => { const t = dateOfDay(day); return (t.getUTCFullYear() - 2020) * 12 + t.getUTCMonth(); };
  for (const p of posts) p.m = monthIndex(p.day);
  const weightFor = (p, focus) => {
    if (!focus) return 0;
    let w = 0;
    for (const [s, tw] of p.tags) {
      if ((focus.kind === 'e' && subs[s].emo === focus.ref.i) || (focus.kind === 's' && s === focus.ref.i)) w = Math.max(w, tw);
    }
    return w;
  };

  // ---------- Colores (tokens) ----------
  // Se leen del CSS y se vuelven a leer al cambiar de modo (claro / noche).
  const THEME_KEY = 'andygram-tema';
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  } catch (err) { /* sin almacenamiento: se usa el modo del sistema */ }
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const hexToRgb = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16));
  const rgba = (hex, a) => `rgba(${hexToRgb(hex).join(',')},${a})`;
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => {
    const t = document.documentElement.getAttribute('data-theme');
    return t ? t === 'dark' : darkQuery.matches;
  };
  let C = {};
  let LINK = {};
  function readColors() {
    const dark = isDark();
    C = {
      bg: cssVar('--bg'), raised: cssVar('--raised'), ink: cssVar('--ink'), ink2: cssVar('--ink-2'),
      ink3: cssVar('--ink-3'), accent: cssVar('--accent'),
      emo: emotions.map((e) => (dark ? e.colors.dark : e.colors.light)),
    };
    LINK = {
      dim: rgba(C.ink, 0.025),
      hover: rgba(C.ink, 0.5),
      se: C.emo.map((c) => rgba(c, dark ? 0.45 : 0.55)),
      ps: C.emo.map((c) => rgba(c, dark ? 0.1 : 0.16)),
      focusSe: C.emo.map((c) => rgba(c, 0.9)),
      focusPs: C.emo.map((c) => rgba(c, 0.55)),
    };
  }
  readColors();
  const FONT_UI = '"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif';
  // Más tenue = más antigua, respecto a la fecha de la línea de tiempo.
  const REC_ALPHA = [1, 0.85, 0.7, 0.55, 0.42];
  const recBin = (p) => {
    const age = state.day - p.day;
    return age < 90 ? 0 : age < 365 ? 1 : age < 730 ? 2 : age < 1460 ? 3 : 4;
  };
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DUR = REDUCED ? 0 : 700;

  // ---------- Estado ----------
  const state = {
    day: LAST_DAY,
    playing: false,
    speed: 1,
    focus: null,
    hover: null,
    view: { name: 'home' },
    back: null,
    listLimit: 40,
    query: '',
  };
  const SPEEDS = [1, 4, 12];
  const DAYS_PER_SEC = 12;

  // ---------- Grafo: nodos y enlaces ----------
  const TAU = Math.PI * 2;
  // Anillo: las emociones agradables quedan arriba y, enfrente de cada una, su contraria.
  const R_RING = Math.round(640 * Math.sqrt(Math.max(11, emotions.length) / 11));
  const RING_OFFSET = Math.max(0, (emotions.filter((e) => e.good).length - 1) / 2);
  const SUB_SPREAD = Math.min(0.13, (TAU / emotions.length) * 0.3);
  const GROUPS = [['Agradables', emotions.filter((e) => e.good)], ['Difíciles', emotions.filter((e) => !e.good)]]
    .filter(([, list]) => list.length);
  const R_POST = 2.6;
  const emoNodes = emotions.map((e, k) => {
    const a = -Math.PI / 2 + ((k - RING_OFFSET) * TAU) / emotions.length;
    const x = Math.cos(a) * R_RING;
    const y = Math.sin(a) * R_RING;
    return { id: `e${k}`, kind: 'e', ref: e, a, ax: x, ay: y, x, y, r: 12, count: 0 };
  });
  const subNodes = subs.map((s) => {
    const hub = emoNodes[s.emo];
    const siblings = emotions[s.emo].subs;
    const j = siblings.indexOf(s.i) - (siblings.length - 1) / 2;
    const a = hub.a + j * SUB_SPREAD;
    const x = Math.cos(a) * R_RING * 0.74;
    const y = Math.sin(a) * R_RING * 0.74;
    return { id: `s${s.i}`, kind: 's', ref: s, ax: x, ay: y, x, y, r: 4, count: 0 };
  });
  const postNodeOf = [];
  const postNodes = [];
  for (const p of posts) {
    if (!p.tags.length) continue;
    const n = { id: `p${p.i}`, kind: 'p', ref: p, r: R_POST };
    postNodeOf[p.i] = n;
    postNodes.push(n);
  }
  const linksAll = [];
  for (const sn of subNodes) linksAll.push({ source: sn, target: emoNodes[sn.ref.emo], kind: 'se' });
  for (const pn of postNodes) for (const [s, w] of pn.ref.tags) linksAll.push({ source: pn, target: subNodes[s], kind: 'ps', w });
  const neighbors = new Map();
  const addNb = (a, b) => { if (!neighbors.has(a)) neighbors.set(a, new Set()); neighbors.get(a).add(b); };
  for (const l of linksAll) { addNb(l.source, l.target); addNb(l.target, l.source); }

  const placeNear = (n) => {
    const sn = subNodes[n.ref.tags[0][0]];
    const ang = Math.random() * TAU;
    const rad = 14 + Math.random() * 26;
    n.x = sn.x + Math.cos(ang) * rad;
    n.y = sn.y + Math.sin(ang) * rad;
    n.vx = 0;
    n.vy = 0;
  };
  for (const n of postNodes) placeNear(n);

  function updateCounts() {
    for (const n of emoNodes) n.count = 0;
    for (const n of subNodes) n.count = 0;
    for (const n of postNodes) {
      if (n.ref.day > state.day) continue;
      for (const e of n.ref.emos) emoNodes[e].count++;
      for (const [s] of n.ref.tags) subNodes[s].count++;
    }
    for (const n of emoNodes) n.r = 10 + Math.sqrt(n.count) * 0.7;
    for (const n of subNodes) n.r = 3.5 + Math.sqrt(n.count) * 0.42;
  }

  function dataUntil(day) {
    const nodes = emoNodes.concat(subNodes, postNodes.filter((n) => n.ref.day <= day));
    const links = linksAll.filter((l) => l.kind === 'se' || l.source.ref.day <= day);
    const deg = new Map();
    for (const l of links) {
      deg.set(l.source, (deg.get(l.source) || 0) + 1);
      deg.set(l.target, (deg.get(l.target) || 0) + 1);
    }
    for (const n of nodes) n.deg = deg.get(n) || 1;
    return { nodes, links };
  }

  // ---------- Resaltado ----------
  let HL = null;
  function recomputeHL() {
    const f = state.focus && (state.focus.set.size || state.focus.kind === 'q') ? state.focus.set : null;
    const h = state.hover ? new Set([state.hover, ...(neighbors.get(state.hover) || [])]) : null;
    if (f && h) { HL = new Set(f); for (const n of h) HL.add(n); } else HL = f || h || null;
    requestRedraw();
  }

  // ---------- Dibujo ----------
  function textAt(ctx, text, x, y, size, weight, color, k, align, baseline) {
    ctx.font = `${weight} ${size}px ${FONT_UI}`;
    ctx.textAlign = align;
    ctx.textBaseline = baseline;
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3.5 / k;
    ctx.strokeStyle = C.bg;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }
  const narrow = () => graphEl.clientWidth < 600;
  const hubLabel = (n) => (narrow() ? n.ref.name.split(' / ')[0] : n.ref.name).toUpperCase();
  const hubFont = () => (narrow() ? 11 : 13.5);
  function hubLabelPos(n, k, extra = 0) {
    const cx = Math.cos(n.a), cy = Math.sin(n.a);
    if (narrow()) {
      return { x: n.x + cx * extra, y: n.y + (cy > 0 ? 1 : -1) * (n.r + 5 / k) + cy * extra, align: 'center', baseline: cy > 0 ? 'top' : 'bottom' };
    }
    const d = n.r + 7 / k + extra;
    return {
      x: n.x + cx * d, y: n.y + cy * d,
      align: cx > 0.12 ? 'left' : cx < -0.12 ? 'right' : 'center',
      baseline: cy > 0.35 ? 'top' : cy < -0.35 ? 'bottom' : 'middle',
    };
  }
  // Etiquetas de emociones sin choques: las más grandes eligen primero; si una se encima con otra,
  // se empuja hacia afuera del anillo.
  let hubLabels = new Map();
  function labelBox(lp, w, h) {
    const x0 = lp.align === 'left' ? lp.x : lp.align === 'right' ? lp.x - w : lp.x - w / 2;
    const y0 = lp.baseline === 'top' ? lp.y : lp.baseline === 'bottom' ? lp.y - h : lp.y - h / 2;
    return { x0, y0, x1: x0 + w, y1: y0 + h };
  }
  const overlaps = (a, b, pad) => a.x0 < b.x1 + pad && b.x0 < a.x1 + pad && a.y0 < b.y1 + pad && b.y0 < a.y1 + pad;
  function layoutHubLabels(ctx, k) {
    const size = hubFont() / k;
    ctx.font = `600 ${size}px ${FONT_UI}`;
    const placed = [];
    hubLabels = new Map();
    for (const n of [...emoNodes].sort((a, b) => b.count - a.count)) {
      const text = hubLabel(n);
      const w = ctx.measureText(text).width, h = size * 1.2;
      let best = null;
      for (let step = 0; step < 5; step++) {
        const lp = hubLabelPos(n, k, (step * 12) / k);
        const box = labelBox(lp, w, h);
        best = { ...lp, box, text };
        if (!placed.some((b) => overlaps(b, box, 3 / k))) break;
      }
      placed.push(best.box);
      hubLabels.set(n, best);
    }
  }
  const isFocusedPost = (n) => state.focus && state.focus.kind === 'p' && state.focus.node === n;
  function subLabelVisible(n, k) {
    if (k > 1.25 || state.hover === n) return true;
    const f = state.focus;
    if (!f) return state.hover && state.hover.kind === 'e' && state.hover.ref.i === n.ref.emo;
    return (f.kind === 'e' && f.ref.i === n.ref.emo) || (f.kind === 's' && f.ref.i === n.ref.i) || (f.kind === 'p' && f.set.has(n));
  }
  function drawNode(n, ctx, k) {
    const on = !HL || HL.has(n);
    const inFocus = !!(state.focus && state.focus.set.has(n));
    if (n.kind === 'p') {
      // Como los recuerdos de Intensamente: del color de su emoción; si tiene varias, partida en sus colores.
      const cols = n.ref.emos;
      const age = REC_ALPHA[recBin(n.ref)];
      ctx.globalAlpha = on ? (inFocus ? Math.max(0.8, age) : age) : 0.07;
      if (cols.length <= 1) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, R_POST, 0, TAU);
        ctx.fillStyle = C.emo[cols[0]];
        ctx.fill();
      } else {
        const step = TAU / cols.length;
        for (let j = 0; j < cols.length; j++) {
          ctx.beginPath();
          ctx.moveTo(n.x, n.y);
          ctx.arc(n.x, n.y, R_POST, -Math.PI / 2 + j * step, -Math.PI / 2 + (j + 1) * step);
          ctx.closePath();
          ctx.fillStyle = C.emo[cols[j]];
          ctx.fill();
        }
      }
      if (isFocusedPost(n) || state.hover === n) {
        ctx.globalAlpha = 1;
        ctx.lineWidth = 2 / k;
        ctx.strokeStyle = C.ink;
        ctx.beginPath();
        ctx.arc(n.x, n.y, R_POST + 3 / k, 0, TAU);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      return;
    }
    ctx.globalAlpha = on ? 1 : 0.25;
    if (n.kind === 's') {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, TAU);
      ctx.fillStyle = C.emo[n.ref.emo];
      ctx.fill();
      if (subLabelVisible(n, k)) textAt(ctx, n.ref.name, n.x + n.r + 4 / k, n.y, 11.5 / k, 500, inFocus ? C.ink : C.ink2, k, 'left', 'middle');
    } else {
      const col = C.emo[n.ref.i];
      const glow = ctx.createRadialGradient(n.x, n.y, n.r * 0.5, n.x, n.y, n.r * 2.8);
      glow.addColorStop(0, rgba(col, inFocus ? 0.5 : 0.22));
      glow.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r * 2.8, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r, 0, TAU);
      ctx.fillStyle = C.raised;
      ctx.fill();
      ctx.lineWidth = (inFocus ? 2.8 : 2) / k;
      ctx.strokeStyle = col;
      ctx.stroke();
      const lp = hubLabels.get(n) || { ...hubLabelPos(n, k), text: hubLabel(n) };
      textAt(ctx, lp.text, lp.x, lp.y, hubFont() / k, 600, C.ink, k, lp.align, lp.baseline);
    }
    ctx.globalAlpha = 1;
  }
  function paintHit(n, color, ctx, k) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(n.x, n.y, Math.max(n.kind === 'p' ? R_POST : n.r, 11 / k), 0, TAU);
    ctx.fill();
    const lp = n.kind === 'e' && hubLabels.get(n);
    if (lp) ctx.fillRect(lp.box.x0, lp.box.y0, lp.box.x1 - lp.box.x0, lp.box.y1 - lp.box.y0);
  }
  function linkOn(l) { return HL && HL.has(l.source) && HL.has(l.target); }
  const linkEmo = (l) => (l.kind === 'se' ? l.source.ref.emo : l.target.ref.emo);
  function linkColor(l) {
    const e = linkEmo(l);
    if (!HL) return l.kind === 'se' ? LINK.se[e] : LINK.ps[e];
    if (!linkOn(l)) return LINK.dim;
    if (state.focus && state.focus.set.has(l.source) && state.focus.set.has(l.target)) return l.kind === 'se' ? LINK.focusSe[e] : LINK.focusPs[e];
    return LINK.hover;
  }
  function linkWidth(l) {
    if (HL && linkOn(l)) return l.kind === 'se' ? 1.6 : 1;
    return l.kind === 'se' ? 1 : 0.6;
  }
  function drawOverlay(ctx, k) {
    const f = state.focus;
    if (!f || f.kind !== 'p' || !f.node) return;
    const a = f.node;
    ctx.lineWidth = 1.2 / k;
    ctx.strokeStyle = rgba(C.ink, 0.55);
    for (const si of a.ref.sims) {
      const b = postNodeOf[si];
      if (!b || b.ref.day > state.day || b.x === undefined) continue;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(b.x, b.y, R_POST + 3 / k, 0, TAU);
      ctx.stroke();
    }
  }

  // ---------- Grafo ----------
  const stageEl = document.getElementById('stage');
  const graphEl = document.getElementById('graph');
  let G = null;
  let redrawTimer = 0;
  let cameraTouched = false;
  const fitPad = () => (graphEl.clientWidth < 600 ? 36 : 56);
  function requestRedraw() {
    if (!G) return;
    G.autoPauseRedraw(false);
    clearTimeout(redrawTimer);
    redrawTimer = setTimeout(() => G && G.autoPauseRedraw(true), 250);
  }
  function anchorForce() {
    let nodes = [];
    const force = (alpha) => {
      for (const n of nodes) {
        if (n.ax === undefined) continue;
        const s = (n.kind === 'e' ? 1 : 0.22) * alpha;
        n.vx += (n.ax - n.x) * s;
        n.vy += (n.ay - n.y) * s;
      }
    };
    force.initialize = (ns) => { nodes = ns; };
    return force;
  }
  function collideBig() {
    let big = [];
    const force = () => {
      for (let i = 0; i < big.length; i++) {
        for (let j = i + 1; j < big.length; j++) {
          const a = big[i], b = big[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 1;
          const min = a.r + b.r + (a.kind === 'e' || b.kind === 'e' ? 40 : 16);
          if (d < min) {
            const push = ((min - d) / d) * 0.25;
            a.vx -= dx * push; a.vy -= dy * push;
            b.vx += dx * push; b.vy += dy * push;
          }
        }
      }
    };
    force.initialize = (ns) => { big = ns.filter((n) => n.kind !== 'p'); };
    return force;
  }

  function initGraph() {
    if (typeof window.ForceGraph !== 'function') {
      stageEl.append(Object.assign(document.createElement('div'), {
        className: 'notice',
        textContent: 'No se pudo cargar el grafo (¿sin conexión?). El panel y la búsqueda siguen funcionando.',
      }));
      return;
    }
    updateCounts();
    G = new window.ForceGraph(graphEl)
      .width(graphEl.clientWidth)
      .height(graphEl.clientHeight)
      .backgroundColor(C.bg)
      .nodeId('id')
      .nodeLabel(() => '')
      .nodeCanvasObjectMode(() => 'replace')
      .nodeCanvasObject(drawNode)
      .nodePointerAreaPaint(paintHit)
      .linkColor(linkColor)
      .linkWidth(linkWidth)
      .d3VelocityDecay(0.35)
      .warmupTicks(140)
      .cooldownTime(7000)
      .minZoom(0.1)
      .maxZoom(10)
      .onNodeHover(onHover)
      .onNodeClick(onNodeClick)
      .onBackgroundClick(() => { hideTip(); clearFocus(); })
      .onRenderFramePre(layoutHubLabels)
      .onRenderFramePost(drawOverlay);
    G.d3Force('center', null);
    G.d3Force('charge').strength((n) => (n.kind === 'e' ? -900 : n.kind === 's' ? -150 : -10)).distanceMax(450);
    G.d3Force('link')
      .distance((l) => (l.kind === 'se' ? 80 : l.w === 3 ? 24 : 38))
      .strength((l) => (l.kind === 'se' ? 0.7 : l.w === 3 ? 1 : 0.55) / Math.min(l.source.deg || 1, l.target.deg || 1));
    G.d3Force('anchor', anchorForce());
    G.d3Force('collideBig', collideBig());
    G.graphData(dataUntil(state.day));
    setTimeout(() => G.zoomToFit(0, fitPad()), 60);
    let fitted = false;
    G.onEngineStop(() => { if (!fitted && !state.focus && !cameraTouched) { fitted = true; G.zoomToFit(DUR, fitPad()); } });
    new ResizeObserver(() => {
      G.width(graphEl.clientWidth).height(graphEl.clientHeight);
      if (cameraTouched) return;
      const f = state.focus;
      if (!f) G.zoomToFit(0, fitPad());
      else if (f.kind === 'p' && f.node && f.node.x !== undefined) G.centerAt(f.node.x, f.node.y, 0);
      else if (f.set.size) G.zoomToFit(0, fitPad() + 4, (n) => f.set.has(n));
    }).observe(graphEl);
    for (const type of ['wheel', 'pointerdown']) graphEl.addEventListener(type, () => { cameraTouched = true; }, { passive: true });
    if (document.fonts) document.fonts.ready.then(requestRedraw);
  }

  // ---------- Tooltip ----------
  const tip = document.getElementById('tip');
  let pointer = { x: 0, y: 0, type: 'mouse' };
  graphEl.addEventListener('pointermove', (ev) => {
    pointer = { x: ev.clientX, y: ev.clientY, type: ev.pointerType };
    if (!tip.hidden) placeTip();
  });
  graphEl.addEventListener('pointerdown', (ev) => { pointer.type = ev.pointerType; if (ev.pointerType !== 'mouse') hideTip(); });
  function placeTip() {
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = pointer.x + 14, y = pointer.y + 14;
    if (x + w > window.innerWidth - 8) x = pointer.x - w - 14;
    if (y + h > window.innerHeight - 8) y = pointer.y - h - 14;
    tip.style.left = `${Math.max(8, x)}px`;
    tip.style.top = `${Math.max(8, y)}px`;
  }
  function showTip(rows) {
    tip.replaceChildren(...rows.filter(Boolean).map(([cls, text]) => el('div', { class: cls, text })));
    tip.hidden = false;
    placeTip();
  }
  function hideTip() { tip.hidden = true; }
  function onHover(n) {
    state.hover = n || null;
    recomputeHL();
    if (!n || pointer.type !== 'mouse') { hideTip(); return; }
    if (n.kind === 'p') {
      const p = n.ref;
      showTip([
        ['t-meta', fmtDate(p.date)],
        ['t-title', p.title],
        p.consejo && ['t-text', p.consejo],
        ['t-meta', p.tags.map(([s]) => subs[s].name).join(' · ')],
      ]);
    } else if (n.kind === 's') {
      showTip([
        ['t-meta', emotions[n.ref.emo].name],
        ['t-title', `${n.ref.name} · ${plural(n.count, 'nota', 'notas')}`],
        ['t-text', n.ref.desc],
      ]);
    } else {
      showTip([
        ['t-title', `${n.ref.name} · ${plural(n.count, 'nota', 'notas')}`],
        ['t-text', n.ref.desc],
      ]);
    }
  }
  function onNodeClick(n) {
    hideTip();
    if (n.kind === 'e') selectEmotion(n.ref.i);
    else if (n.kind === 's') selectSub(n.ref.i);
    else openPost(n.ref);
  }

  // ---------- Foco ----------
  function setFocus(f, camera) {
    state.focus = f;
    if (camera) cameraTouched = false;
    recomputeHL();
    renderChips();
    drawTimeline();
    renderLegend();
    if (!G || !camera) return;
    if (camera === 'fit') {
      const has = f && f.set;
      G.zoomToFit(DUR, fitPad() + 4, has ? (n) => has.has(n) : undefined);
    } else if (camera === 'node' && f.node && f.node.x !== undefined) {
      G.centerAt(f.node.x, f.node.y, DUR);
      G.zoom(Math.max(G.zoom(), graphEl.clientWidth < 600 ? 1.5 : 2.4), DUR);
    }
  }
  function clearFocus() {
    const had = !!state.focus;
    state.back = null;
    setFocus(null, had ? 'fit' : null);
    state.view = { name: 'home' };
    renderPanel();
  }
  function selectEmotion(ei) {
    const set = new Set([emoNodes[ei]]);
    for (const si of emotions[ei].subs) set.add(subNodes[si]);
    for (const pn of postNodes) if (pn.ref.emos.includes(ei)) set.add(pn);
    state.listLimit = 40;
    state.view = { name: 'list', kind: 'e', ref: emotions[ei] };
    setFocus({ kind: 'e', ref: emotions[ei], node: emoNodes[ei], set }, 'fit');
    renderPanel(true);
  }
  function selectSub(si) {
    const set = new Set([subNodes[si], emoNodes[subs[si].emo]]);
    for (const pn of postNodes) if (pn.ref.tags.some(([s]) => s === si)) set.add(pn);
    state.listLimit = 40;
    state.view = { name: 'list', kind: 's', ref: subs[si] };
    setFocus({ kind: 's', ref: subs[si], node: subNodes[si], set }, 'fit');
    renderPanel(true);
  }
  function openPost(p) {
    if (state.view.name !== 'post') state.back = { view: state.view, focus: state.focus };
    if (p.day > state.day) setDay(LAST_DAY);
    const node = postNodeOf[p.i];
    const set = new Set();
    if (node) {
      set.add(node);
      for (const [s] of p.tags) { set.add(subNodes[s]); set.add(emoNodes[subs[s].emo]); }
      for (const si of p.sims) if (postNodeOf[si]) set.add(postNodeOf[si]);
    }
    state.view = { name: 'post', ref: p };
    setFocus({ kind: 'p', ref: p, node, set }, 'node');
    renderPanel(true);
  }
  function goBack() {
    const b = state.back;
    state.back = null;
    if (!b) { clearFocus(); return; }
    state.view = b.view;
    setFocus(b.focus, b.focus ? 'fit' : null);
    renderPanel(true);
  }

  // ---------- Búsqueda ----------
  let searchIdx = null;
  let searchTimer = 0;
  const qEl = document.getElementById('q');
  const SEARCH_SCOPE = RAW.fullText
    ? 'La búsqueda es por texto: las notas están en inglés y los consejos en español.'
    : 'La búsqueda cubre títulos (en inglés) y consejos (en español).';
  qEl.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => runSearch(qEl.value), 220);
  });
  qEl.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { qEl.value = ''; runSearch(''); } });
  function runSearch(raw) {
    const q = raw.trim();
    state.query = q;
    if (q.length < 2) {
      if (state.view.name === 'search') clearFocus();
      return;
    }

    const base = h - 4;

  drawTimeline();
  new ResizeObserver(drawTimeline).observe(tlCanvas);
  // Enlace directo: #enojo (emoción), #presion (sub-sentimiento) o #<slug de la nota>
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash) {
    setTimeout(() => {
      const e = emotions.find((x) => x.id === hash);
      if (e) return selectEmotion(e.i);
      const sub = subs.find((x) => x.id === hash);
      if (sub) return selectSub(sub.i);
      const p = posts.find((x) => x.slug === hash);
      if (p) openPost(p);
    }, 300);
  }
})();
</script>
